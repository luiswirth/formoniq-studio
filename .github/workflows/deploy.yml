name: Deploy

# Builds the viewer to WebAssembly and publishes it to Cloudflare Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One live deployment at a time; a newer push supersedes an in-flight one, but
# lets it finish rather than cancelling a half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      # The built-in meshes are `include_bytes!`-embedded at compile time and
      # tracked in git LFS, so the real bytes must be checked out, not pointers.
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # The `wasm-bindgen` CLI must match the `wasm-bindgen` crate exactly; read
      # the resolved version from the lockfile so the two never drift.
      - name: Resolve wasm-bindgen version
        id: wb
        run: |
          version=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock \
            | grep '^version' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.version }}

      # `.cargo/config.toml` supplies the `getrandom` wasm backend cfg; no
      # `RUSTFLAGS` env here, which would override it.
      - name: Build
        run: cargo build --release --lib --target wasm32-unknown-unknown

      - name: Bindgen
        run: |
          wasm-bindgen \
            --target web \
            --no-typescript \
            --out-dir dist \
            --out-name formoniq_studio \
            target/wasm32-unknown-unknown/release/formoniq_studio.wasm
          cp web/index.html dist/
          # The solve worker loads the same glue this bindgen just emitted, so
          # it ships beside it rather than being bundled into the page.
          cp web/solve_worker.js dist/
          # Stamp the page with the commit it was built from. The glue and the
          # wasm are only valid as a pair and their filenames never change, so
          # without this a returning visitor can pair a cached module with a
          # freshly fetched one -- which fails at instantiation, not at fetch.
          sed -i "s/__BUILD_STAMP__/${GITHUB_SHA}/" dist/index.html
          grep -q "__BUILD_STAMP__" dist/index.html && exit 1 || true

      # The Cloudflare Pages project is named after the repository.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy dist
            --project-name=${{ github.event.repository.name }}
            --branch=main
